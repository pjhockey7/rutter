[workspace]
resolver = "2"
members = [
	"core",
	"app",
	"charts",
	"tides",
	"render",
	"platform/linux",
	"platform/android",
]

# Shared metadata, so a version bump is one edit rather than four.
[workspace.package]
version = "0.1.0"
edition = "2021"
# Raised from 1.82 to take egui 0.37, which is the first release on wgpu 30.
#
# The old floor was justified by "the Android NDK's bundled toolchain lags",
# which was simply wrong: nothing here compiles with the NDK's Rust. The Rust
# comes from rust-overlay (currently 1.99), and the NDK only supplies clang
# for linking and for the C in SQLite. There was never a reason to hold back.
rust-version = "1.95"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rutter-core = { path = "core" }
rutter-charts = { path = "charts" }
rutter-tides = { path = "tides" }
rutter-render = { path = "render" }
rutter-app = { path = "app" }

wgpu = "30.0"
winit = "0.30"
raw-window-handle = "0.6"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
android-activity = "0.6"
android_logger = "0.14"

# egui for the interface. Chosen because it renders into an existing wgpu
# render pass rather than owning the window, which is what an overlay on a
# chart needs — and because it is pure Rust, so it cross-compiles to the
# Android ABIs like everything else here.
#
# The versions are coupled: egui-wgpu must be built against the same wgpu as
# the renderer, or the two link separate copies and nothing matches. 0.37 is
# the first egui release on wgpu 30.
# `default_fonts` must be asked for explicitly. egui 0.37 changed `default`
# to the empty set — it included the fonts up to 0.31 — so a plain
# `egui = "0.37"` compiles with no font data at all and every glyph renders
# as an empty box. The symptom looks like a broken texture upload and is
# nothing of the kind.
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"

[workspace.lints.rust]
# The core is the part that has to be right; unsafe belongs only in the
# platform shims, and even there it should be visible in review.
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Panicking is a crash on a phone in the rain with no stack trace. Prefer
# Result and Option at the boundaries.
unwrap_used = "warn"
expect_used = "warn"

# Debug builds of a renderer are too slow to judge anything by, and release
# builds take long enough to discourage running them. Optimise dependencies
# even in debug: the app's own code stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Android APK size matters more than the last few percent of speed.
strip = true
