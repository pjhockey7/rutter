[package]
name = "rutter-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rutter's application logic, independent of any platform"

[dependencies]
rutter-core.workspace = true
rutter-charts.workspace = true
rutter-tides.workspace = true
rutter-render.workspace = true

# The panel's own types come from rutter-render; this crate drives them, so
# it needs egui to hand over a `Ui`. Not egui-winit: translating native
# events is the one part of the interface that is genuinely per-platform.
egui.workspace = true

log.workspace = true

# For the serial transport's termios setup, and nothing else. Already in the
# tree several times over through winit, so this costs no build time and adds
# nothing to the supply chain — and it is the alternative to a serial crate
# with a platform backend of its own.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The worker tests drive it against the charts crate's own fixture, and
# integration tests see only dev-dependencies.
rutter-charts.workspace = true
rutter-core.workspace = true

[lints]
workspace = true
