[package]
name = "rutter-android"
description = "Android board support: NativeActivity entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# cdylib: the APK loads this with System.loadLibrary, so it has to be a real
# shared object. `rlib` alongside it so `cargo check` on the host still works
# — without it, checking this crate off-Android is awkward.
name = "rutter"
crate-type = ["cdylib", "rlib"]

[dependencies]
rutter-app.workspace = true
rutter-charts.workspace = true
rutter-render.workspace = true
rutter-tides.workspace = true

# egui, but not egui-winit: raw touches are translated by hand here. See the
# note on EguiState.
egui.workspace = true
# No wgpu dependency — see platform/linux/Cargo.toml.
pollster.workspace = true
log.workspace = true

winit = { workspace = true, features = ["android-native-activity", "rwh_06"] }

# Android-only, so that `cargo check` on the laptop does not try to build the
# NDK glue. cfg() rather than a feature flag: the condition is the target, and
# a feature could be set wrongly.
[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
android_logger.workspace = true

# Location is Java-only on Android — there is no NDK API for it — so the
# phone's own GPS has to be reached through JNI. Both of these are already
# in the tree underneath android-activity, so this declares what is being
# used rather than adding anything.
jni = "0.22"
ndk-context = "0.1"

# For `LatLon`, which the GPS fills in. The other crates come in through
# rutter-app, but this one is named directly by platform/android/src/gps.rs.
rutter-core.workspace = true

[lints]
workspace = true
